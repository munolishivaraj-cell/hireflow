spring:
  application:
    name: hireflow

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hireflow?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:hireflow}
    password: ${DB_PASSWORD:hireflow}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer turns an unreadable message into an error that goes to the DLT
      # instead of crashing the consumer in a loop.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: com.shivaraj.hireflow.event
        spring.json.value.default.type: com.shivaraj.hireflow.event.HiringEvent

hireflow:
  apply-limit:
    max: ${APPLY_LIMIT_MAX:5}
    window: ${APPLY_LIMIT_WINDOW:1h}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
