# Local infrastructure:   docker compose up -d redis kafka        (use your own MySQL on 3306)
#                         docker compose up -d mysql redis kafka  (MySQL in Docker, on host port 3307)
# Whole stack incl. app:  docker compose --profile app up -d --build   -> http://localhost:8080
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: hireflow
      MYSQL_USER: hireflow
      MYSQL_PASSWORD: hireflow
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"   # 3307 so it doesn't clash with a MySQL already installed on the machine
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      # Single-node KRaft broker. Two listeners: localhost:9092 for apps on the host,
      # kafka:29092 for the app container inside this network.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  app:
    profiles: ["app"]
    build: .
    mem_limit: 512m   # same memory as Render's free instance
    cpus: 0.5
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_URL: jdbc:mysql://mysql:3306/hireflow
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
